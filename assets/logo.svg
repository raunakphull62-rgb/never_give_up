<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Klang logo">
  <defs>
    <linearGradient id="klangGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#0b1020"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- K stem + arms -->
  <g stroke="url(#klangGrad)" stroke-linecap="round" fill="none">
    <line x1="168" y1="128" x2="168" y2="336" stroke-width="46"/>
    <line x1="188" y1="238" x2="308" y2="128" stroke-width="42"/>
    <line x1="208" y1="256" x2="318" y2="336" stroke-width="42"/>
  </g>
  <!-- resonance sound bars -->
  <g fill="url(#barGrad)">
    <rect x="348" y="216" width="18" height="80" rx="9"/>
    <rect x="376" y="188" width="18" height="136" rx="9"/>
    <rect x="404" y="226" width="18" height="60" rx="9"/>
  </g>
  <text x="256" y="432" text-anchor="middle" font-family="monospace" font-size="52" letter-spacing="14" fill="#e2e8f0">KLANG</text>
</svg>
