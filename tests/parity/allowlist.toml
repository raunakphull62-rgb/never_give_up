# --- S3: stdlib self-tests (26 packages; interpreter-only code) ------------
# Every package self-test must print "<pkg>: OK" and exit 0 on v1 (checked
# by the harness, not just by eye). All 26 use strings/lists/maps/IO, so
# the int-only JIT rejects each one loudly, and the v2 grammar (no imports)
# cannot parse any of them. One entry per (package, backend) keeps the list
# honest per package: if any single package ever starts passing on JIT/v2,
# its entry mismatches and the gate fails.

[[entry]]
programs = ["stdlib-packages/base64/base64_test.klang", "stdlib-packages/cli/cli_test.klang", "stdlib-packages/collections/collections_test.klang", "stdlib-packages/compress/compress_test.klang", "stdlib-packages/crypto/crypto_test.klang", "stdlib-packages/csv/csv_test.klang", "stdlib-packages/fs/fs_test.klang", "stdlib-packages/hex/hex_test.klang", "stdlib-packages/http/http_test.klang", "stdlib-packages/io/io_test.klang", "stdlib-packages/itertools/itertools_test.klang", "stdlib-packages/json/json_test.klang", "stdlib-packages/logging/logging_test.klang"]
backend = "jit"
outcome = "exit"
exit = 1
stdout = ""
stderr_contains = "JIT-FAIL"
reason = "S3: package self-tests are interpreter-only code (strings, lists, maps, IO); JIT rejection is the contract. Verified 2026-10-08: all exit 1 with JIT-FAIL."

