name: Release Binaries

# Builds Klang for:
#   - Linux x86_64 (standard Linux desktops/servers/PCs)
#   - Linux aarch64 (musl static; ordinary ARM64 Linux PCs/Raspberry Pi)
#   - Android aarch64 (bionic libc via the Android NDK, API 24+; Termux).
#     The old static musl binary could not resolve DNS on Android (no
#     /etc/resolv.conf), so Termux needs this real bionic build; the musl
#     build stays as a SEPARATE asset for ordinary ARM64 Linux.
#   - Windows x86_64
#   - macOS aarch64 (Apple Silicon M1-M4)
#   - macOS x86_64 (Intel Mac, cross-compiled on the Apple Silicon runner —
#     plain `cargo build --target x86_64-apple-darwin` works there, no
#     osxcross needed; kept so the klang-cli-darwin-x64 npm package stays
#     in sync with the other platforms)
#
# After the GitHub Release is created, the publish-npm job stages the same
# binaries into the klang-cli npm packages and publishes them (platform
# packages first, klang-cli wrapper last). Publishing needs the NPM_TOKEN
# repo secret; without it the job logs a skip message and succeeds.
#
# Triggers on pushing a version tag (v0.1.0, v0.2.0, etc.) or manually via
# the Actions tab ("workflow_dispatch"). Attaches all binaries to a GitHub
# Release automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            use_ndk: false

          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            use_ndk: false

          - name: android-arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            use_cross: false
            use_ndk: true
            android_api: 24
            ndk_version: r27c

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            use_ndk: false

          - name: macos-aarch64-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            use_ndk: false

          - name: macos-x86_64-intel
            os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            use_ndk: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for musl/ARM cross-compile)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Android NDK (pinned version). Prefers the NDK preinstalled on the
      # ubuntu runner via ANDROID_NDK_HOME; falls back to nttld/setup-ndk
      # pinned to matrix.ndk_version. Either path exports the same
      # ANDROID_NDK_HOME for the build step below.
      - name: Setup Android NDK
        id: setup-ndk
        if: matrix.use_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.ndk_version }}
          add-to-path: false

      # S1b: stamp the real release version into Cargo.toml (and Cargo.lock)
      # BEFORE cargo build, only on version tags (refs/tags/v*). The binary
      # reports env!("CARGO_PKG_VERSION"), so stamping makes `klang --version`
      # print the tag (vX.Y.Z -> X.Y.Z) instead of the repo's 0.7.0.
      # Portable across Linux/macOS/Windows runners (bash + python3/python).
      # Non-tag runs leave Cargo.toml untouched.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "Stamping Cargo.toml version to $TAG (from $GITHUB_REF_NAME)"
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" - "$TAG" <<'PYEOF'
          import pathlib
          import re
          import sys
          ver = sys.argv[1]
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?", ver):
              print(f"warning: tag version '{ver}' is not X.Y.Z; stamping anyway", file=sys.stderr)
          # Cargo.toml: replace version under [package] only.
          toml_path = pathlib.Path("Cargo.toml")
          text = toml_path.read_text()
          lines = text.splitlines(keepends=True)
          in_package = False
          done = False
          for i, line in enumerate(lines):
              s = line.strip()
              if s.startswith("["):
                  in_package = (s == "[package]")
                  continue
              if in_package and not done and re.match(r'^version\s*=\s*".*?"\s*(#.*)?$', s):
                  indent = line[: len(line) - len(line.lstrip())]
                  comment = ""
                  m = re.match(r'^(.*?)(\s*#.*)$', line.rstrip("\r\n"))
                  # Preserve trailing comment if any.
                  if m and '"' in m.group(1):
                      # m.group(2) is the comment part.
                      comment = m.group(2)
                      lines[i] = f'{indent}version = "{ver}"{comment}\n'
                  else:
                      # Keep original newline style.
                      nl = "\r\n" if line.endswith("\r\n") else "\n"
                      lines[i] = f'{indent}version = "{ver}"{nl}'
                  done = True
          if not done:
              print("error: [package] version not found in Cargo.toml", file=sys.stderr)
              sys.exit(1)
          toml_path.write_text("".join(lines))
          # Cargo.lock: update the klang package entry consistently.
          lock_path = pathlib.Path("Cargo.lock")
          if lock_path.is_file():
              lock = lock_path.read_text().splitlines(keepends=True)
              out = []
              expect_version = False
              updated = False
              for line in lock:
                  s = line.strip()
                  if s == 'name = "klang"':
                      expect_version = True
                      out.append(line)
                      continue
                  if expect_version and re.match(r'^version\s*=\s*".*?"\s*$', s):
                      indent = line[: len(line) - len(line.lstrip())]
                      nl = "\r\n" if line.endswith("\r\n") else "\n"
                      out.append(f'{indent}version = "{ver}"{nl}')
                      expect_version = False
                      updated = True
                      continue
                  # A new [[package]] resets the expectation (klang entry is one block).
                  if s == "[[package]]":
                      expect_version = False
                  else:
                      # Keep expectation only for the immediate next version line;
                      # any other key clears it to avoid touching other packages.
                      if expect_version and "=" in s:
                          # If this line is not the version line, clear (should not happen
                          # for well-formed lock where version follows name directly).
                          pass
                  out.append(line)
              if updated:
                  lock_path.write_text("".join(out))
                  print(f"stamped Cargo.lock klang version to {ver}")
              else:
                  print("warning: klang entry not found in Cargo.lock; leaving it", file=sys.stderr)
          print(f"stamped Cargo.toml version to {ver}")
          PYEOF
          echo "Stamped version:"
          grep -E '^version =' Cargo.toml | head -n 1

      - name: Build (native)
        if: ${{ !matrix.use_cross && !matrix.use_ndk }}
        run: cargo build --release --target ${{ matrix.target }} --bin klang

      - name: Build (cross, uses Docker under the hood)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin klang

      # Real Android (bionic) build. API level comes from matrix.android_api
      # (24+). The NDK LLVM clang wrapper is the linker AND the C compiler;
      # llvm-ar is the archiver. ANDROID_NDK_HOME is preinstalled on ubuntu
      # runners; setup-ndk above guarantees it even if the preinstall goes
      # away (its outputs.ndk-path wins when set).
      - name: Build (Android NDK, bionic)
        if: matrix.use_ndk
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "${NDK:-}" ]; then
            NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          fi
          if [ -z "${NDK:-}" ]; then
            echo "Android NDK not found (set ANDROID_NDK_HOME)" >&2
            exit 1
          fi
          API="${{ matrix.android_api }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="$TOOLCHAIN/aarch64-linux-android${API}-clang"
          if [ ! -x "$LINKER" ]; then
            echo "NDK linker missing: $LINKER" >&2
            exit 1
          fi
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER"
          export CC_aarch64_linux_android="$LINKER"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          echo "NDK=$NDK API=$API LINKER=$LINKER"
          cargo build --release --target ${{ matrix.target }} --bin klang

      # Package the binary. Windows produces klang.exe; everything else
      # produces a plain `klang` executable.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/klang dist/klang
          cd dist
          tar -czf klang-${{ matrix.name }}.tar.gz klang

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/klang.exe dist/klang.exe
          cd dist
          7z a klang-${{ matrix.name }}.zip klang.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: klang-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # SHA256SUMS covers every release archive (linux-x86_64, linux-arm64,
      # android-arm64, macos x2, windows). install.sh verifies against it
      # when sha256sum is available.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum */klang-*.tar.gz */klang-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
            artifacts/SHA256SUMS
          generate_release_notes: true

  # Publishes the prebuilt npm packages (esbuild/biome pattern: no install
  # scripts, no network at install time – the binary ships inside the
  # matching optionalDependency). Runs only on version tags, after the
  # binaries are built and the GitHub Release exists.
  #
  # Needs the NPM_TOKEN repo secret (an npm automation/granular token with
  # publish rights on klang-cli and all klang-cli-* packages). Without it
  # the job logs a skip message and succeeds – the GitHub Release is
  # unaffected. Nothing is published from local sandboxes; only this job
  # publishes, and only from tags. The token is passed via environment and
  # is never printed or written to any file.
  publish-npm:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"

      - name: Publish klang-cli packages to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "publish-npm: NPM_TOKEN is not set – skipping npm publish."
            echo "The GitHub Release above is unaffected. To enable npm publishing,"
            echo "add an npm token as the NPM_TOKEN repository secret (see docs/releasing.md)."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "publish-npm: staging klang-cli@${VERSION}"

          # Unpack each release asset next to its npm package. The tarballs
          # contain a single top-level binary (klang / klang.exe).
          tmpdir=$(mktemp -d)
          unpack_tar() { tar -xzf "$1" -C "$tmpdir"; }
          unpack_zip() { unzip -o -j "$1" -d "$tmpdir"; }
          artifact() { ls artifacts/*/"$1" 2>/dev/null | head -n 1; }

          install_unix() { # <asset> <pkg>
            local src
            src=$(artifact "$1" || true)
            if [ -z "${src:-}" ]; then
              echo "publish-npm: WARNING: asset $1 missing – skipping $2."
              return 0
            fi
            rm -f "$tmpdir/klang"
            unpack_tar "$src"
            mkdir -p "npm-package/$2/bin"
            cp -f "$tmpdir/klang" "npm-package/$2/bin/klang"
            chmod +x "npm-package/$2/bin/klang"
            echo "publish-npm: staged $2/bin/klang"
          }
          install_win() { # <asset> <pkg>
            local src
            src=$(artifact "$1" || true)
            if [ -z "${src:-}" ]; then
              echo "publish-npm: WARNING: asset $1 missing – skipping $2."
              return 0
            fi
            rm -f "$tmpdir/klang.exe"
            unpack_zip "$src"
            mkdir -p "npm-package/$2/bin"
            cp -f "$tmpdir/klang.exe" "npm-package/$2/bin/klang.exe"
            echo "publish-npm: staged $2/bin/klang.exe"
          }

          install_unix "klang-linux-x86_64.tar.gz" "klang-cli-linux-x64"
          # Ordinary ARM64 Linux gets the musl static build; Termux/Android
          # gets the real bionic build (Node on Termux reports
          # process.platform === "android", mapped by bin/klang.js).
          install_unix "klang-linux-arm64.tar.gz" "klang-cli-linux-arm64"
          install_unix "klang-android-arm64.tar.gz" "klang-cli-android-arm64"
          install_unix "klang-macos-aarch64-apple-silicon.tar.gz" "klang-cli-darwin-arm64"
          install_unix "klang-macos-x86_64-intel.tar.gz" "klang-cli-darwin-x64"
          install_win "klang-windows-x86_64.zip" "klang-cli-windows-x64"

          # Pin every package version (and the wrapper's optionalDependencies)
          # to the git tag (vX.Y.Z -> X.Y.Z).
          PKG_VERSION="$VERSION" node -e '
            const fs = require("fs");
            const version = process.env.PKG_VERSION;
            const repository = {
              type: "git",
              url: "https://github.com/raunakphull62-rgb/never_give_up.git"
            };
            const pkgs = ["klang-cli", "klang-cli-linux-x64", "klang-cli-linux-arm64",
              "klang-cli-android-arm64", "klang-cli-darwin-x64",
              "klang-cli-darwin-arm64", "klang-cli-windows-x64"];
            for (const p of pkgs) {
              const f = `npm-package/${p}/package.json`;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = version;
              j.repository = repository;
              if (j.optionalDependencies) {
                for (const k of Object.keys(j.optionalDependencies)) {
                  j.optionalDependencies[k] = version;
                }
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              console.log(`publish-npm: ${p} -> ${version}`);
            }'

          publish_failures=()
          publish_one() { # <package-dir>
            local dir="$1"
            local name
            name=$(node -p "require('./npm-package/$dir/package.json').name")
            if [ "$dir" = "klang-cli" ]; then
              if [ ! -f "npm-package/$dir/bin/klang.js" ]; then
                echo "publish-npm: WARNING: no JavaScript launcher staged for $name – skipping."
                SUMMARY+=("$name@$VERSION: skipped (no launcher staged)")
                return 0
              fi
            elif [ ! -f "npm-package/$dir/bin/klang" ] && [ ! -f "npm-package/$dir/bin/klang.exe" ]; then
              echo "publish-npm: WARNING: no platform binary staged for $name – skipping."
              SUMMARY+=("$name@$VERSION: skipped (no binary staged)")
              return 0
            fi
            local published
            published=$(npm view "${name}@${VERSION}" version 2>/dev/null || true)
            if [ "$published" = "$VERSION" ]; then
              echo "publish-npm: $name@$VERSION already published – skipping."
              SUMMARY+=("$name@$VERSION: skipped (already published)")
              return 0
            fi
            echo "publish-npm: publishing $name@$VERSION"
            if npm publish "./npm-package/$dir" --provenance --access public; then
              SUMMARY+=("$name@$VERSION: published")
              return 0
            fi
            echo "publish-npm: WARNING: publish with --provenance failed for $name, retrying without provenance."
            if npm publish "./npm-package/$dir" --access public; then
              SUMMARY+=("$name@$VERSION: published (without provenance)")
              return 0
            fi
            echo "publish-npm: ERROR: failed to publish $name@$VERSION"
            SUMMARY+=("$name@$VERSION: FAILED")
            FAILED=1
            return 0
          }

          # Platform packages first, wrapper last (idempotent per package).
          # Each result is recorded in SUMMARY; a failure records FAILED but
          # does not abort the remaining packages, so the final summary shows
          # every package as published, skipped, or failed.
          FAILED=0
          SUMMARY=()
          publish_one "klang-cli-linux-x64"
          publish_one "klang-cli-linux-arm64"
          publish_one "klang-cli-android-arm64"
          publish_one "klang-cli-darwin-x64"
          publish_one "klang-cli-darwin-arm64"
          publish_one "klang-cli-windows-x64"
          publish_one "klang-cli"
          echo "publish-npm: summary (version $VERSION):"
          for line in "${SUMMARY[@]}"; do
            echo "publish-npm: - $line"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "publish-npm: FAILED: one or more packages failed to publish."
            exit 1
          fi
          echo "publish-npm: done."
