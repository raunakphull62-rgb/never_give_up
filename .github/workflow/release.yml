name: Release Binaries

# Builds Klang for:
#   - Linux x86_64 (standard Linux desktops/servers/PCs)
#   - Linux aarch64-musl (ARM Linux PCs/Raspberry Pi, AND doubles as the
#     Termux/Android build — a static musl binary runs fine under Termux's
#     proot environment, same trick ripgrep/fd/starship use; no NDK needed)
#   - Windows x86_64
#   - macOS x86_64 (Intel) and aarch64 (Apple Silicon M1-M4)
#
# Triggers on pushing a version tag (v0.1.0, v0.2.0, etc.) or manually via
# the Actions tab ("workflow_dispatch"). Attaches all binaries to a GitHub
# Release automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false

          - name: linux-aarch64-musl-termux
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

          - name: macos-x86_64-intel
            os: macos-13
            target: x86_64-apple-darwin
            use_cross: false

          - name: macos-aarch64-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for musl/ARM cross-compile)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --bin klang

      - name: Build (cross, uses Docker under the hood)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin klang

      # Package the binary. Windows produces klang.exe; everything else
      # produces a plain `klang` executable.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/klang dist/klang
          cd dist
          tar -czf klang-${{ matrix.name }}.tar.gz klang

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/klang.exe dist/klang.exe
          cd dist
          7z a klang-${{ matrix.name }}.zip klang.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: klang-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
